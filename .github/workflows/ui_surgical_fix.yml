name: SmartStock UI Surgical Fix

on:
  push:
    branches: ["chatgpt/ui-fixes-2026-08-26"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply approved UI corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          styles = Path('styles.py')
          text = styles.read_text(encoding='utf-8')
          old = '''                    rgba(4, 54, 34, 0.90) 0%,\n                    rgba(4, 54, 34, 0.70) 48%,\n                    rgba(4, 54, 34, 0.15) 100%'''
          new = '''                    rgba(4, 54, 34, 0.30) 0%,\n                    rgba(4, 54, 34, 0.15) 48%,\n                    rgba(4, 54, 34, 0.03) 100%'''
          if old not in text:
              raise SystemExit('Expected hero overlay was not found; refusing to modify styles.py.')
          styles.write_text(text.replace(old, new, 1), encoding='utf-8')

          about = Path('pages/6_ℹ️_About.py')
          text = about.read_text(encoding='utf-8')
          old_import = 'from styles import apply_global_styles, render_sidebar_logo, render_header_banner'
          new_import = 'from styles import apply_global_styles, render_header_banner'
          if old_import not in text:
              raise SystemExit('Expected About imports were not found; refusing to modify About page.')
          text = text.replace(old_import, new_import, 1)

          old_sidebar = '''with st.sidebar:\n    render_sidebar_logo()\n\n    st.markdown("---")'''
          new_sidebar = '''with st.sidebar:\n    st.markdown("---")'''
          if old_sidebar not in text:
              raise SystemExit('Expected duplicate About sidebar logo block was not found; refusing to modify About page.')
          about.write_text(text.replace(old_sidebar, new_sidebar, 1), encoding='utf-8')
          PY

      - name: Validate Python files
        run: python -m compileall -q app.py styles.py pages utils

      - name: Commit corrections and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.py "pages/6_ℹ️_About.py"
          git rm .github/workflows/ui_surgical_fix.yml
          git commit -m "Restore approved SmartStock UI styling"
          git push